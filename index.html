<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>HOTEL FINE AR - MONIN</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="ar-video" src="monin_movie.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted autoplay></video>
        </a-assets>
        <a-marker preset="hiro" id="marker">
            <a-video src="#ar-video" width="2.4" height="1.35" position="0 0 0" rotation="-90 0 0" id="ar-video-entity"></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const videoEntity = document.getElementById('ar-video-entity');
        videoEntity.addEventListener('materialtextureloaded', function () {
            const mesh = videoEntity.getObject3D('mesh');
            if (mesh && mesh.material) {
                mesh.material.onBeforeCompile = function (shader) {
                    shader.fragmentShader = shader.fragmentShader.replace(
                        'void main() {',
                        `void main() {
                           vec4 color = texture2D(map, vUv);
                           // 緑色(0,1,0)を判定して透過させる（0.5の数値を調整で濃淡を調整可能）
                           float greenDiff = distance(color.rgb, vec3(0.0, 1.0, 0.0));
                           if (greenDiff < 0.5) { discard; }`
                    );
                };
                mesh.material.transparent = true;
            }
        });

        const video = document.getElementById('ar-video');
        document.getElementById('marker').addEventListener('markerFound', () => video.play());
        document.getElementById('marker').addEventListener('markerLost', () => video.pause());
    </script>
</body>
</html>
