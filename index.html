<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>HOTEL FINE AR - MONIN GREEN CHROMACUTE</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ar-link-button {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 0; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white; font-size: 17px; font-weight: bold; border: none;
            border-radius: 30px; box-shadow: 0 4px 20px rgba(255,117,140,0.4);
            z-index: 999999 !important; display: block !important; text-decoration: none;
            font-family: sans-serif; text-align: center; width: 85%;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="ar-video" src="aroma_craftsoda_0603.webm" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted autoplay></video>
        </a-assets>
        <a-marker preset="hiro" id="marker">
            <!-- 3D空間上で透明度（alpha）を正しく処理する設定にしました -->
            <a-video src="#ar-video" width="2.4" height="1.35" position="0 0 0" rotation="-90 0 0"
                     id="ar-video-entity" material="shader: flat; src: #ar-video; transparent: true; side: double;"></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <a id="ar-link-button" href="https://www.hotel-fine.co.jp/fair-spring2026-specialtop/index.php" target="_blank" rel="noopener noreferrer">香るモナン・クラフトソーダ</a>
    <script>
        // 【特効薬】動画の透明（アルファ）チャネルをAR上で強制的に引き出すプログラム
        AFRAME.registerShader('transparent-video', {
            schema: { src: { type: 'map' } },
            init: function (data) {
                const videoTexture = new THREE.VideoTexture(document.getElementById('ar-video'));
                videoTexture.format = THREE.RGBAFormat; // 透明データ（RGBA）を維持
                this.material = new THREE.MeshBasicMaterial({
                    map: videoTexture,
                    transparent: true,
                    side: THREE.DoubleSide
                });
            },
            update: function () { /* 特になし */ }
        });

        const videoEntity = document.getElementById('ar-video-entity');
        videoEntity.addEventListener('materialtextureloaded', function () {
            const mesh = videoEntity.getObject3D('mesh');
            if (mesh && mesh.material) {
                // 黒色の部分を完全に透過（消去）させる命令に書き換えます
                mesh.material.onBeforeCompile = function (shader) {
                    shader.fragmentShader = shader.fragmentShader.replace(
                        'void main() {',
                        `void main() {
                           vec4 color = texture2D(map, vUv);
                           // 完全に黒、または限りなく黒に近い背景を透明にする処理
                           if (color.r < 0.05 && color.g < 0.05 && color.b < 0.05) { discard; }`
                    );
                };
                mesh.material.transparent = true;
                mesh.material.needsUpdate = true;
            }
        });

        // 再生・一時停止の処理
        const video = document.getElementById('ar-video');
        document.getElementById('marker').addEventListener('markerFound', () => {
            video.play().catch(e => console.log(e));
        });
        document.getElementById('marker').addEventListener('markerLost', () => {
            video.pause();
        });
        document.body.addEventListener('click', () => {
            video.play().catch(e => console.log(e));
        });
    </script>
</body>
</html>
