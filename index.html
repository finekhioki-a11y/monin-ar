<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <title>HOTEL FINE AR - MONIN CHROMA</title>

    <!-- 💡 カメラの不具合を起こしにくい、安定したバージョンのシステムに変更しました -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        // よりシンプルに、カメラ起動に負荷をかけない透過プログラム
        AFRAME.registerShader('chromakey', {
            schema: {
                src: { type: 'map' },
                color: { type: 'color', default: '#00FF00' }
            },
            init: function(data) {
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        texture1: { type: 't', value: new THREE.Texture() },
                        color: { type: 'c', value: new THREE.Color(data.color) }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main(void) {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D texture1;
                        uniform vec3 color;
                        varying vec2 vUv;
                        void main(void) {
                            vec4 videoColor = texture2D(texture1, vUv);
                            // 緑色（背景）との距離を計算
                            float diff = distance(videoColor.rgb, color);
                            // 緑に近い部分を透明にする
                            if(diff < 0.45) {
                                discard;
                            } else {
                                gl_FragColor = videoColor;
                            }
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() {
                var videoEl = this.el.sceneEl.assets.querySelector(this.data.src);
                if (videoEl && videoEl.readyState >= videoEl.HAVE_CURRENT_DATA) {
                    if (!this.texture) {
                        this.texture = new THREE.VideoTexture(videoEl);
                        this.material.uniforms.texture1.value = this.texture;
                    }
                    this.texture.needsUpdate = true;
                }
            }
        });
    </script>

    <style>
        #ar-link-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 0;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(255,117,140,0.4);
            z-index: 999999 !important; 
            display: block !important; 
            text-decoration: none;
            font-family: sans-serif;
            text-align: center;
            width: 85%;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;">
        <a-assets>
            <video id="ar-video" src="monin_movie.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-marker preset="hiro" id="marker">
            <!-- 映像のチラつきを抑え、カメラと干渉しにくい設定に調整 -->
            <a-entity geometry="primitive: plane; width: 2.4; height: 1.35;" 
                      material="shader: chromakey; src: #ar-video; color: 0.0 1.0 0.0;" 
                      position="0 0.01 0" 
                      rotation="-90 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </scene>

    <a id="ar-link-button" href="https://www.hotel-fine.co.jp/fair-spring2026-specialtop/index.php" target="_blank" rel="noopener noreferrer">香るモナン・クラフトソーダ</a>

    <script>
        const marker = document.getElementById('marker');
        const video = document.getElementById('ar-video');

        marker.addEventListener('markerFound', () => {
            video.play().catch(err => { console.log("自動再生ブロック中"); });
        });

        marker.addEventListener('markerLost', () => {
            video.pause();
        });

        document.body.addEventListener('click', () => {
            video.play();
        });
    </script>
</body>
</html>
