<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <title>HOTEL FINE AR - MONIN GREEN CHROMACUTE</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        #ar-link-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 0;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(255,117,140,0.4);
            z-index: 999999 !important; 
            display: block !important; 
            text-decoration: none;
            font-family: sans-serif;
            text-align: center;
            width: 85%;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        #ar-link-button:active {
            background: linear-gradient(135deg, #e6647b 0%, #e66e9d 100%);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="ar-video" src="monin_movie.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-marker preset="hiro" id="marker">
            <a-video src="#ar-video" width="2.4" height="1.35" position="0 0 0" rotation="-90 0 0"
                     material="shader: flat; transparent: true; alphaTest: 0.5;"
                     id="ar-video-entity">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </scene>

    <a id="ar-link-button" href="https://www.hotel-fine.co.jp/fair-spring2026-specialtop/index.php" target="_blank" rel="noopener noreferrer">香るモナン・クラフトソーダ</a>

    <script>
        const marker = document.getElementById('marker');
        const video = document.getElementById('ar-video');
        const videoEntity = document.getElementById('ar-video-entity');

        // 💡 カメラがバグらないよう、ARシステム起動後に裏側で「緑色だけを透明にする処理」を動画に安全に注射します
        videoEntity.addEventListener('materialtextureloaded', function () {
            const mesh = videoEntity.getObject3D('mesh');
            if (mesh && mesh.material) {
                mesh.material.onBeforeCompile = function (shader) {
                    shader.fragmentShader = shader.fragmentShader.replace(
                        'vec4 color = texture2D( src, vUV );',
                        `
                        vec4 color = texture2D( src, vUV );
                        // 基準となる緑色との距離を測る
                        float diff = distance(color.rgb, vec3(0.0, 1.0, 0.0));
                        // 緑色に近いピクセル（背景）の透明度をゼロにする
                        if (diff < 0.55) {
                            color.a = 0.0;
                        }
                        `
                    );
                };
                mesh.material.needsUpdate = true;
            }
        });

        marker.addEventListener('markerFound', () => {
            video.play().catch(err => { console.log("自動再生ブロック中"); });
        });

        marker.addEventListener('markerLost', () => {
            video.pause();
        });

        document.body.addEventListener('click', (e) => {
            if(e.target.id !== 'ar-link-button') {
                video.play();
            }
        });
    </script>
</body>
</html>
