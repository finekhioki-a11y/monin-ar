<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>HOTEL FINE AR - MONIN GREEN CHROMACUTE</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #ar-link-button {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 0; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white; font-size: 17px; font-weight: bold; border: none;
            border-radius: 30px; box-shadow: 0 4px 20px rgba(255,117,140,0.4);
            z-index: 999999 !important; display: block !important; text-decoration: none;
            font-family: sans-serif; text-align: center; width: 85%;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- ① 動画ファイルをさっき作ったWebMに変更しました -->
            <video id="ar-video" src="aroma_craftsoda_0603.webm" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>
        <a-marker preset="hiro" id="marker">
            <!-- ② 透過を有効にするために material="transparent: true; alphaTest: 0.5;" を追加しました -->
            <a-video src="#ar-video" width="2.4" height="1.35" position="0 0 0" rotation="-90 0 0"
                     id="ar-video-entity" material="transparent: true; alphaTest: 0.5;"></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <a id="ar-link-button" href="https://www.hotel-fine.co.jp/fair-spring2026-specialtop/index.php" target="_blank" rel="noopener noreferrer">香るモナン・クラフトソーダ</a>
    <script>
        // ③ プログラムで緑を消す複雑な処理（シェーダー）は不要になったので全削除し、シンプルな再生処理だけにしました
        const video = document.getElementById('ar-video');
        document.getElementById('marker').addEventListener('markerFound', () => video.play());
        document.getElementById('marker').addEventListener('markerLost', () => video.pause());
        document.body.addEventListener('click', () => video.play());
    </script>
</body>
</html>
